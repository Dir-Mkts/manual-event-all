<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Americas Alliance — Manual Maestro Conferencia Anual v0.3</title>
<style>
:root{
  --navy:#0a1628;--navy2:#112240;--accent:#1e88e5;--gold:#f59e0b;
  --green:#10b981;--red:#ef4444;--gray:#94a3b8;--light:#f1f5f9;
  --gov:#7c3aed;--f0:#0891b2;--f1:#0d9488;--f2:#059669;
  --f3:#d97706;--f4:#dc2626;--eje:#1e40af;--ft:#6d28d9;
  --pos:#065f46;--kpi:#374151;
  font-family:'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--navy);color:#e2e8f0;min-height:100vh;}

/* NAV */
#topnav{background:var(--navy2);border-bottom:1px solid #1e3a5f;padding:0;position:sticky;top:0;z-index:100;display:flex;align-items:stretch;overflow-x:auto;}
.nav-btn{background:none;border:none;color:#94a3b8;cursor:pointer;padding:14px 16px;font-size:12px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:3px solid transparent;transition:all .2s;}
.nav-btn .icon{font-size:18px;}
.nav-btn .hint{font-size:10px;opacity:.6;}
.nav-btn:hover{color:#e2e8f0;background:rgba(255,255,255,.05);}
.nav-btn.active{color:#fff;border-bottom-color:var(--phase-color,var(--accent));}
#brand{padding:12px 20px;font-weight:700;font-size:14px;color:var(--gold);border-right:1px solid #1e3a5f;white-space:nowrap;display:flex;align-items:center;}

/* ROLE FILTER */
#rolebar{background:#0d1f3c;padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #1e3a5f;}
.role-btn{background:rgba(255,255,255,.07);border:1px solid #1e3a5f;color:#94a3b8;border-radius:20px;padding:5px 14px;font-size:12px;cursor:pointer;transition:all .2s;}
.role-btn:hover{background:rgba(255,255,255,.12);color:#e2e8f0;}
.role-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* CONTENT */
#main{padding:24px 20px;max-width:1100px;margin:0 auto;}

/* HOME */
.home-hero{text-align:center;padding:40px 20px;}
.home-hero h1{font-size:28px;font-weight:700;color:#fff;margin-bottom:8px;}
.home-hero p{color:var(--gray);font-size:14px;}
.phase-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:32px;}
.phase-card{background:var(--navy2);border:1px solid #1e3a5f;border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;border-left:4px solid var(--c,var(--accent));}
.phase-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3);}
.phase-card .icon{font-size:28px;margin-bottom:10px;}
.phase-card h3{font-size:14px;font-weight:600;color:#fff;margin-bottom:4px;}
.phase-card p{font-size:12px;color:var(--gray);}

/* SECTION HEADER */
.section-header{margin-bottom:24px;}
.section-header h2{font-size:20px;font-weight:700;color:#fff;}
.section-header p{color:var(--gray);font-size:13px;margin-top:4px;}
.gate-box{background:linear-gradient(135deg,rgba(30,136,229,.15),rgba(30,136,229,.05));border:1px solid rgba(30,136,229,.3);border-radius:10px;padding:14px 18px;margin:16px 0;display:flex;align-items:center;gap:10px;}
.gate-box .lock{font-size:20px;}
.gate-box p{font-size:13px;color:#93c5fd;}
.gate-box strong{color:#60a5fa;}

/* PROC CARDS */
.proc-grid{display:grid;gap:16px;}
.proc-card{background:var(--navy2);border:1px solid #1e3a5f;border-radius:12px;overflow:hidden;transition:all .2s;}
.proc-card.hidden{display:none;}
.proc-header{padding:16px 20px;border-left:4px solid var(--c,var(--accent));cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.proc-header:hover{background:rgba(255,255,255,.03);}
.proc-meta{flex:1;}
.proc-code{font-size:11px;font-weight:700;color:var(--c,var(--accent));text-transform:uppercase;letter-spacing:.5px;}
.proc-title{font-size:15px;font-weight:600;color:#fff;margin:4px 0;}
.proc-info{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.badge{font-size:11px;padding:3px 8px;border-radius:4px;font-weight:500;}
.badge-owner{background:rgba(30,136,229,.2);color:#93c5fd;}
.badge-window{background:rgba(148,163,184,.1);color:#94a3b8;}
.badge-type{background:rgba(16,185,129,.15);color:#6ee7b7;}
.badge-type.puntual{background:rgba(245,158,11,.15);color:#fcd34d;}
.proc-toggle{font-size:18px;color:var(--gray);flex-shrink:0;margin-top:2px;}

.proc-body{display:none;padding:0 20px 20px;border-top:1px solid #1e3a5f;}
.proc-body.open{display:block;}

.hitos-box{background:rgba(109,40,217,.1);border:1px solid rgba(109,40,217,.3);border-radius:8px;padding:12px 16px;margin:14px 0;font-size:13px;color:#c4b5fd;}
.hitos-box strong{color:#a78bfa;}
.dep-box{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:10px 14px;margin:14px 0;font-size:12px;color:#fde68a;}

.steps-list{margin:16px 0;}
.steps-list h4{font-size:12px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.step-item{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;}
.step-num{background:var(--c,var(--accent));color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px;}
.step-text{font-size:13px;color:#cbd5e1;line-height:1.5;}

.check-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.check-item input[type=checkbox]{margin-top:3px;accent-color:var(--c,var(--accent));width:15px;height:15px;flex-shrink:0;}
.check-label{font-size:13px;color:#cbd5e1;line-height:1.5;cursor:pointer;}
.check-label.checked{color:#64748b;text-decoration:line-through;}

.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;}
.meta-box{background:rgba(255,255,255,.04);border-radius:8px;padding:14px;}
.meta-box h4{font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.meta-box p{font-size:12px;color:#cbd5e1;line-height:1.5;}
.meta-box.full{grid-column:1/-1;}
.meta-box.warn{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);}
.meta-box.warn h4{color:#fca5a5;}
.meta-box.warn p{color:#fecaca;}

/* SECTION PAGES */
.section-page{display:none;}
.section-page.active{display:block;}

/* GOV */
.gov-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;}
.gov-table th{background:rgba(124,58,237,.2);color:#c4b5fd;padding:10px 14px;text-align:left;font-weight:600;}
.gov-table td{padding:10px 14px;border-top:1px solid #1e3a5f;color:#cbd5e1;vertical-align:top;}
.gov-table tr:hover td{background:rgba(255,255,255,.02);}

/* KPI TABLE */
.kpi-table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0;}
.kpi-table th{background:rgba(30,136,229,.2);color:#93c5fd;padding:10px 14px;text-align:left;font-weight:600;}
.kpi-table td{padding:10px 14px;border-top:1px solid #1e3a5f;color:#cbd5e1;vertical-align:top;}
.kpi-table tr:hover td{background:rgba(255,255,255,.02);}

/* FT CARDS */
.ft-card{background:var(--navy2);border:1px solid #1e3a5f;border-radius:10px;padding:18px 20px;margin-bottom:14px;border-left:4px solid var(--ft);}
.ft-card h3{font-size:14px;font-weight:600;color:#c4b5fd;margin-bottom:10px;}
.ft-card p{font-size:13px;color:#cbd5e1;line-height:1.5;margin-bottom:6px;}
.ft-card ul{margin:8px 0 0 16px;}
.ft-card ul li{font-size:13px;color:#cbd5e1;margin-bottom:5px;line-height:1.5;}
.severity-table{width:100%;border-collapse:collapse;font-size:12px;}
.severity-table th{background:rgba(109,40,217,.2);color:#c4b5fd;padding:8px 12px;text-align:left;}
.severity-table td{padding:8px 12px;border-top:1px solid #1e3a5f;color:#cbd5e1;vertical-align:top;}

/* ANEXOS */
.anexo-section{margin-bottom:28px;}
.anexo-section h3{font-size:15px;font-weight:600;color:#fff;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #1e3a5f;}
.format-table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0;}
.format-table th{background:rgba(30,136,229,.15);color:#93c5fd;padding:8px 12px;text-align:left;font-weight:600;}
.format-table td{padding:8px 12px;border-top:1px solid #1e3a5f;color:#cbd5e1;vertical-align:top;}
.format-table tr:hover td{background:rgba(255,255,255,.02);}
.info-box{background:rgba(255,255,255,.04);border:1px solid #1e3a5f;border-radius:8px;padding:14px 16px;margin:10px 0;font-size:13px;color:#cbd5e1;line-height:1.6;}
.info-box ul{margin:6px 0 0 16px;}
.info-box li{margin-bottom:4px;}
.anexo-table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0;}
.anexo-table th{background:rgba(6,95,70,.3);color:#6ee7b7;padding:8px 12px;text-align:left;}
.anexo-table td{padding:8px 12px;border-top:1px solid #1e3a5f;color:#cbd5e1;vertical-align:top;}

/* PROGRESS */
.progress-bar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin:8px 0;}
.progress-fill{height:100%;border-radius:2px;background:var(--c,var(--accent));transition:width .3s;}

/* MINUTO TABLE */
.minuto-table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0;}
.minuto-table th{background:rgba(30,136,229,.15);color:#93c5fd;padding:8px 12px;text-align:left;}
.minuto-table td{padding:8px 12px;border-top:1px solid #1e3a5f;color:#cbd5e1;vertical-align:top;}

@media(max-width:600px){
  .meta-grid{grid-template-columns:1fr;}
  .phase-grid{grid-template-columns:1fr;}
  #main{padding:16px 12px;}
}
</style>
</head>
<body>

<nav id="topnav">
  <div id="brand">⚡ AA</div>
</nav>

<div id="rolebar">
  <button class="role-btn active" data-action="setRole" data-role="all">👥 Todas las áreas</button>
  <button class="role-btn" data-action="setRole" data-role="coo">🎯 COO</button>
  <button class="role-btn" data-action="setRole" data-role="ventas">💼 Ventas</button>
  <button class="role-btn" data-action="setRole" data-role="marketing">📢 Marketing</button>
  <button class="role-btn" data-action="setRole" data-role="sistemas">💻 Sistemas</button>
  <button class="role-btn" data-action="setRole" data-role="finanzas">💰 Finanzas</button>
  <button class="role-btn" data-action="setRole" data-role="eventos">🎪 Eventos</button>
</div>

<div id="main"></div>

<script>
const STAGES=[

  {id:'anexos',label:'Anexos',                   icon:'📎', hint:'',              color:'var(--kpi)'},

const GATES={
  f0:'Contrato hotelero firmado + presupuesto base CEO aprobado',
  f1:'Sitio web activo + primeras inscripciones + primer patrocinador cerrado',
  f2:'Todos los contratos de producción firmados + agenda confirmada',
  f3:'100% proveedores confirmados + inventario recibido y verificado',
  f4:'Go formal del COO con acta firmada',
  eje:'Cierre de sede + bitácora firmada por COO → abrir Fase 6',
  pos:'Informe final aprobado por CEO → edición oficialmente cerrada',
};

const PHASE_DESC={
  f0:'El evento no existe aún de manera pública. Esta fase cierra cuando el CEO aprueba sede, fechas y presupuesto base, y se firma el contrato hotelero. Ningún procedimiento de fases posteriores debe activarse sin esa puerta cerrada.',
  f1:'El evento existe públicamente. Esta fase crea la identidad visual, fija precios y lanza la convocatoria. Solo cuando el branding y los mensajes están aprobados se abren las reservaciones.',
  f2:'Se contratan y cierran todos los servicios de producción. Cierra cuando cada proveedor tiene contrato firmado y la agenda del evento está confirmada en versión aprobada.',
  f3:'Se construyen los instrumentos de operación: scheduler, transporte, kits, escaletas y permisos. Cierra cuando el 100% de proveedores está confirmado y el inventario de materiales está recibido y verificado.',

  pos:'El evento no cierra cuando termina la fiesta: cierra cuando todas las excepciones tienen responsable, solución y fecha. Esta fase consume información de los procesos continuos de todas las fases anteriores.',

// PROCEDURES DATA — exact text from doc v0.3
const PROCS=[
  // ==================== F0 ====================
  {id:'f0-01',code:'F0-01',stage:'f0',
   title:'Definición de sede, fechas y concepto',

  },
  {id:'f0-02',code:'F0-02',stage:'f0',

   owner:'COO',support:'Finanzas, Ventas',window:'T-11 a T-8 meses',

   dep:'F0-01 aprobado; estimación razonable de habitaciones y asistentes.',

// ---- STATE ----
let currentStage='home';
let currentRole='all';
let checks={};

function saveChecks(){try{localStorage.setItem('aa_v3',JSON.stringify(checks));}catch(e){}}
function loadChecks(){try{const d=localStorage.getItem('aa_v3');if(d)checks=JSON.parse(d);}catch(e){}}
loadChecks();

// ---- HELPERS ----
function stageColor(id){
  const s=STAGES.find(x=>x.id===id);
  return s?s.color:'var(--accent)';
}
function stageLabel(id){
  const s=STAGES.find(x=>x.id===id);
  return s?s.label:id;
}
function typeBadge(type){
  if(type==='puntual')return'<span class="badge badge-type puntual">⚡ ACTIVACIÓN PUNTUAL</span>';
  return'<span class="badge badge-type">🔄 PROCESO CONTINUO</span>';
}

// ---- RENDER NAV ----
function renderNav(){
  const nav=document.getElementById('topnav');
  nav.innerHTML='<div id="brand">⚡ AA</div>';
  STAGES.forEach(s=>{
    const btn=document.createElement('button');
    btn.className='nav-btn'+(currentStage===s.id?' active':'');
    btn.style.setProperty('--phase-color',s.color);
    btn.dataset.action='go';
    btn.dataset.stage=s.id;
    btn.innerHTML=`<span class="icon">${s.icon}</span><span>${s.label}</span>${s.hint?`<span class="hint">${s.hint}</span>`:''}`;
    nav.appendChild(btn);
  });
}

// ---- ROLE BUTTONS ----
function renderRoleBar(){
  document.querySelectorAll('.role-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.role===currentRole);
  });
}

// ---- RENDER PROC CARD ----
function renderProc(p){
  const c=stageColor(p.stage);
  const isVisible=currentRole==='all'||p.roles.includes(currentRole);
  const checksDone=p.steps.filter((_,i)=>{
    const k=p.id+'-'+i;
    return checks[k];
  }).length;
  const pct=p.steps.length>0?Math.round(checksDone/p.steps.length*100):0;

  let stepsHtml=p.steps.map((s,i)=>{
    const k=p.id+'-'+i;
    const done=!!checks[k];
    return`<div class="check-item">
      <input type="checkbox" data-action="toggleCheck" data-check="${k}" ${done?'checked':''}>
      <label class="check-label${done?' checked':''}">${s}</label>
    </div>`;
  }).join('');

  let hml=`<div class="proc-card${isVisible?'':' hidden'}" id="card-${p.id}" style="--c:${c}">
    <div class="proc-header" data-action="go" data-stage="${p.id}-toggle">
      <div class="proc-meta">
        <div class="proc-code">${p.code}</div>
        <div class="proc-title">${p.title}</div>
        <div class="proc-info">
          <span class="badge badge-owner">👤 ${p.owner}</span>
          <span class="badge badge-window">📅 ${p.window}</span>
          ${typeBadge(p.type)}
        </div>
        ${p.steps.length>0?`<div class="progress-bar" style="margin-top:8px"><div class="progress-fill" style="width:${pct}%;background:${c}"></div></div>`:''}
      </div>
      <div class="proc-toggle">▸</div>
    </div>
    <div class="proc-body" id="body-${p.id}">`;

  if(p.dep)hml+=`<div class="dep-box">⚠️ <strong>Entrada / dependencia:</strong> ${p.dep}</div>`;
  if(p.hitos)hml+=`<div class="hitos-box"><strong>Hitos de seguimiento:</strong> ${p.hitos}</div>`;

  hml+=`<div class="steps-list"><h4>Pasos</h4>${stepsHtml}</div>`;
  hml+=`<div class="meta-grid">`;
  hml+=`<div class="meta-box full"><h4>📋 Evidencia de cierre</h4><p>${p.evidence}</p></div>`;
  if(p.control)hml+=`<div class="meta-box"><h4>✅ Punto de control</h4><p>${p.control}</p></div>`;

  hml+=`</div></div></div>`;

}

// ---- RENDER STAGE ----
function renderStage(){
  const main=document.getElementById('main');
  if(currentStage==='home'){
    renderHome(main); return;
  }
  if(currentStage==='gov'){renderGov(main);return;}
  if(currentStage==='ft'){renderFT(main);return;}
  if(currentStage==='kpi'){renderKPI(main);return;}
  if(currentStage==='anexos'){renderAnexos(main);return;}

  const st=STAGES.find(s=>s.id===currentStage);
  if(!st){main.innerHTML='';return;}

  const procs=PROCS.filter(p=>p.stage===currentStage);
  const gate=GATES[currentStage];
  const desc=PHASE_DESC[currentStage]||'';
  const c=st.color;

  let html=`<div class="section-header">
    <h2>${st.icon} ${st.label}</h2>
    <p>${desc}</p>
  </div>`;

  if(gate){
    html+=`<div class="gate-box"><span class="lock">🔒</span><p><strong>PUERTA DE SALIDA:</strong> ${gate}</p></div>`;
  }

  if(procs.length===0){
    html+=`<p style="color:var(--gray);font-size:14px;margin-top:20px;">Sin procedimientos en esta sección.</p>`;
  } else {
    html+=`<div class="proc-grid">`;
    procs.forEach(p=>{html+=renderProc(p);});
    html+=`</div>`;
  }
  main.innerHTML=html;
}

// ---- TOGGLE PROC ----
function toggleProc(procId){
  const body=document.getElementById('body-'+procId);
  const card=document.getElementById('card-'+procId);
  if(!body)return;
  const isOpen=body.classList.contains('open');
  body.classList.toggle('open',!isOpen);
  const toggle=card?card.querySelector('.proc-toggle'):null;
  if(toggle)toggle.textContent=isOpen?'▸':'▾';
}

// ---- TOGGLE CHECK ----
function toggleCheck(key,val){
  checks[key]=val;
  saveChecks();
  const label=document.querySelector(`input[data-check="${key}"]`)?.closest('.check-item')?.querySelector('.check-label');
  if(label)label.classList.toggle('checked',val);
  // update progress bar
  const parts=key.split('-');
  const procId=parts.slice(0,parts.length-1).join('-');
  const proc=PROCS.find(p=>p.id===procId);
  if(proc){
    const done=proc.steps.filter((_,i)=>checks[procId+'-'+i]).length;
    const pct=Math.round(done/proc.steps.length*100);
    const fill=document.querySelector('#card-'+procId+' .progress-fill');
    if(fill)fill.style.width=pct+'%';
  }
}

// ---- NAVIGATE ----
function go(id){
  // proc toggle
  if(id&&id.endsWith('-toggle')){
    const procId=id.replace('-toggle','');
    toggleProc(procId);
    return;
  }
  currentStage=id;
  renderNav();
  renderStage();
  window.scrollTo(0,0);
}

// ---- SET ROLE ----
function setRole(role){
  currentRole=role;
  renderRoleBar();
  // filter visible cards
  PROCS.forEach(p=>{
    const card=document.getElementById('card-'+p.id);
    if(!card)return;
    const visible=role==='all'||p.roles.includes(role);
    card.classList.toggle('hidden',!visible);
  });
}

// ---- EVENT DELEGATION ----
document.addEventListener('click',function(e){
  const goEl=e.target.closest('[data-action="go"]');
  if(goEl){go(goEl.dataset.stage);return;}
  const roleEl=e.target.closest('[data-action="setRole"]');
  if(roleEl){setRole(roleEl.dataset.role);return;}
});
document.addEventListener('change',function(e){
  if(e.target.dataset.action==='toggleCheck'){
    toggleCheck(e.target.dataset.check,e.target.checked);
  }
});

// ---- INIT ----
renderNav();
renderStage();
</script>
